name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts
        run: python -m py_compile scripts/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node for browser checks
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run browser checks
        if: matrix.python-version == '3.13'
        run: node tests/run_bills_browser_check.mjs python

      - name: Build and validate zero-network demo
        run: |
          python scripts/build_demo_site.py --output-dir /tmp/bundestag-puls-demo
          test -f /tmp/bundestag-puls-demo/protocols/plenarprotokoll-21-84.html
          python scripts/build_dip_pulse_site.py --validate-publication /tmp/bundestag-puls-demo
          python scripts/build_dip_pulse_site.py --list-capabilities > /tmp/bundestag-puls-capabilities.txt
          python scripts/build_dip_pulse_site.py --explain-config > /tmp/bundestag-puls-config.txt

      - name: Reject development-marked publication artifacts
        run: |
          python scripts/build_demo_site.py --output-dir /tmp/bundestag-puls-demo-dev --include-dev-view
          if python scripts/build_dip_pulse_site.py --validate-publication /tmp/bundestag-puls-demo-dev; then
            echo "development-marked artifact unexpectedly passed publication validation" >&2
            exit 1
          fi
